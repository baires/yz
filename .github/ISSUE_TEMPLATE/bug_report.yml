name: Bug report
description: Report something that is broken or behaving unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Command(s) you ran and any relevant output (redact credentials and URLs with tokens).
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: yz version
      description: Output of `yz version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: e.g. macOS arm64, Linux x86_64
    validations:
      required: true
