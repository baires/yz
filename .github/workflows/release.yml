name: Release

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      created-release: ${{ steps.release-train.outputs.created-release }}
      release-tag: ${{ steps.release-train.outputs.release-tag }}
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: git config
        run: |
          git config --local user.name '${{ github.actor }}'
          git config --local user.email '${{ github.actor }}@users.noreply.github.com'

      - uses: WillAbides/release-train@v3.9.0
        id: release-train
        with:
          create-release: true
          release-refs: master
          initial-release-tag: v0.1.0
          labels: |
            feat=semver:minor
            fix=semver:patch
            perf=semver:patch
            refactor=semver:patch
            chore=semver:none
            docs=semver:none
            style=semver:none
            breaking change=semver:breaking
          pre-tag-hook: bash scripts/release-hook.sh

  # release-train publishes with GITHUB_TOKEN, which does not start workflows
  # listening for release: published. require_token is true only when this
  # run created a release. homebrew-tap.yml still listens for that event for
  # releases created outside this workflow (for example from the GitHub UI).
  notify-homebrew-tap:
    needs: release
    uses: ./.github/workflows/homebrew-tap.yml
    secrets: inherit
    with:
      tag_name: ${{ needs.release.outputs.release-tag }}
      require_token: ${{ needs.release.outputs.created-release == 'true' }}
